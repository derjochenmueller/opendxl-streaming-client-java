name: build

# Branch-specific (see README.md, "Branches"): this branch is the JDK 21 line, so the workflow runs on the
# `master` branch and builds with JDK 21 only. The jdk17/jdk11/jdk8 branches carry their own single-JDK matrix.
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 21 ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java-version }}
    - name: Build with Gradle
      run: ./gradlew build
