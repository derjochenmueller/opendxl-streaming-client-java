name: build

# Branch-specific (see README.md, "Branches"): this branch is the JDK 11 line, so the workflow runs on the
# `jdk11` branch and builds with JDK 11 only. master (JDK 21) and the other jdk* branches carry their own matrix.
on:
  workflow_dispatch:
  push:
    branches:
      - jdk11
  pull_request:
    branches:
      - jdk11

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 11 ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java-version }}
    - name: Build with Gradle
      run: ./gradlew build
