plugins {
    id 'checkstyle'
    id 'java-library'
    id 'distribution'
    id 'maven-publish'
    id 'signing'
    id "com.gradleup.shadow" version "8.3.11"
    id "kr.motd.sphinx" version "2.10.1"
    id "jacoco"
    id "org.owasp.dependencycheck" version "12.2.2" apply false
}

apply plugin: 'base'
apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'maven-publish'
apply plugin: 'signing'

group 'com.opendxl'

// The client is consumed from Java 8 applications; keep the bytecode and the language level at Java 8
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

// OWASP dependency-check needs Java 11+ and an NVD API key (https://nvd.nist.gov/developers/request-an-api-key).
// It is only applied when the key is provided: ./gradlew dependencyCheckAnalyze -PnvdApiKey=<key>
if (project.hasProperty('nvdApiKey')) {
    apply plugin: 'org.owasp.dependencycheck'
    dependencyCheck {
        nvd {
            apiKey = project.property('nvdApiKey')
        }
        suppressionFile = file("${projectDir}/config/dependency-check/owasp-suppression.xml")
    }
    check.dependsOn dependencyCheckAnalyze
}

jacoco {
    toolVersion = "0.8.15"
    reportsDirectory = layout.buildDirectory.dir("reports/coverage")
}

jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir("reports/coverage")
    }
}

// The main resources overlap with the Java sources; keep the pre-Gradle 7 behaviour for the copied duplicates
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.github.stefanbirkner:system-rules:1.19.0'
    testImplementation 'com.github.tomakehurst:wiremock-jre8:2.35.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    implementation 'com.e-movimento.tinytools:privilegedaccessor:1.2.2'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'commons-codec:commons-codec:1.22.1'
    implementation ('org.apache.httpcomponents:httpclient:4.5.14'){
        exclude group : 'commons-codec', module: 'commons-codec'
    }
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
}

// Jar Manifest info
jar {
    manifest {
        attributes 'Main-Class': 'com.opendxl.streaming.cli.CommandLineInterface',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
    }
}

// Task for creating a jar with the source files
task sourceJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

// Task for creating a jar with JavaDoc
task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

javadoc {
    source = sourceSets.main.allJava
    options.memberLevel = JavadocMemberLevel.PUBLIC
}

artifacts {
    archives jar
    archives sourceJar
    archives javadocJar
}

// Set up the distribution zip
distributions {
    main {
        distributionBaseName = 'dxlstreamingclient-java-sdk'
        contents {
            from(jar) {
                into('lib')
            }
            from(shadowJar) {
                into("lib")
            }
            from(configurations.compileClasspath) {
                into("lib/3rdparty")
            }
            from(sphinx) {
                into('doc')
            }
            from('sample') {
                into 'sample'
            }
            from(shadowJar) {
                into("sample/lib")
            }
            from('distribution')
        }

    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/java'
        }
    }
    sample {
        java {
            srcDir 'sample/src'
        }
        compileClasspath += main.output + configurations.compileClasspath
        runtimeClasspath += main.output + configurations.runtimeClasspath
    }
    test {
        resources {
            srcDir 'src/test/resources'
        }
    }
}


// Make check style run before creating a jar
jar.dependsOn(checkstyleMain)

// Force distZip to be dependent on javadocJar and sourceJar
distZip.dependsOn javadocJar
distZip.dependsOn sourceJar

sphinx {
    // Change the source directory.
    sourceDirectory = "${projectDir}/docs"
    // Change the output directory.
    outputDirectory = "${project.buildDir}/docs"
}

task versionFile()  {
    doLast {
        new File("${projectDir}/VERSION").text = """$version"""
    }
}

checkstyle {
    sourceSets = []
    toolVersion '8.39'

}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = group
            pom {
                name = 'OpenDXL Streaming Java Client'
                description = 'An OpenDXL streaming client library for Java'
                url = 'https://github.com/opendxl/opendxl-streaming-client-java'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        email = 'support@opendxl.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/opendxl/opendxl-streaming-client-java.git'
                    developerConnection = 'scm:git:ssh://github.com/opendxl/opendxl-streaming-client-java.git'
                    url = 'https://github.com/opendxl/opendxl-streaming-client-java'
                }
            }

            from components.java

            artifact(sourceJar) {
                classifier = 'sources'
            }
            artifact(javadocJar) {
                classifier = 'javadoc'
            }

        }
    }

    repositories {
        maven {
            url = "$buildDir/repo"

//            def releasesRepoUrl = "https://oss.sonatype.org/service/local/staging/deploy/maven2"
//            def snapshotsRepoUrl = "https://oss.sonatype.org/content/repositories/snapshots"
//            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
//            credentials {
//                username sonatypeUsername
//                password sonatypePassword
//            }
        }
    }

}

// Replace version string in some files that contains version reference
task replaceVersionInREADME() {
    if (!version.endsWith('SNAPSHOT')) {
        // Maven
        ant.replaceregexp(match: '<version>(.+)</version>', replace: "<version>${version}</version>", flags: 'g', byline: true) {
            fileset(dir: '.', includes: 'README.md')
        }
        ant.replaceregexp(match: '<version>(.+)</version>', replace: "<version>${version}</version>", flags: 'g', byline: true) {
            fileset(dir: 'docs', includes: 'index.rst')
        }
        // Gradle
        ant.replaceregexp(match: "com\\.opendxl\\.:dxlstreamingclient\\:(.+)", replace: "com.opendxl:dxlstreamingclient:${version}'", flags: 'g', byline: true) {
            fileset(dir: '.', includes: 'README.md')
        }
        ant.replaceregexp(match: "com\\.opendxl\\:dxlstreamingclient\\:(.+)", replace: "com.opendxl:dxlstreamingclient:${version}'", flags: 'g', byline: true) {
            fileset(dir: 'docs', includes: 'index.rst')
        }
    }
}

signing {sign publishing.publications.maven}

// Declare the implicit task dependencies of the distribution (required since Gradle 7.1)
tasks.named('distTar') {
    it.mustRunAfter(tasks.named('javadoc'))
}

tasks.named('javadocJar') {
    it.mustRunAfter(tasks.named('sphinx'))
}

distZip.dependsOn javadocJar
distZip.dependsOn sourceJar
sphinx.dependsOn(versionFile)
assemble.dependsOn(replaceVersionInREADME)